<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>加速刹车采集器</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--bd:#d9e0ea;--txt:#1f2937;--muted:#667085;--ok:#0e9f6e;--pri:#2563eb;--warn:#b7791f;--bad:#c43d3d;--line:#edf1f6}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--txt);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;background:#fff;border-bottom:1px solid var(--bd)}
.left,.right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.title{font-size:17px;font-weight:700}
.tag{border:1px solid var(--bd);border-radius:6px;background:#f8fafc;padding:5px 8px;font-size:12px;white-space:nowrap}
.ok{color:#07694a;background:#e9f8f1;border-color:#9ed9bf}
.warn{color:#865b16;background:#fff7e7;border-color:#efd7a8}
.bad{color:#942d2d;background:#fff0f0;border-color:#efb8b8}
button,input{border:1px solid var(--bd);border-radius:6px;background:#fff;padding:7px 10px;font-size:13px;height:33px}
input{width:110px}
button{cursor:pointer}
button.primary{background:var(--pri);border-color:var(--pri);color:#fff}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
button:disabled{opacity:.48;cursor:not-allowed}
label{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--txt)}
label input[type=checkbox]{width:auto;height:auto}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(560px,1fr) 390px;gap:10px;padding:10px}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:8px;min-height:0}
.plot-panel{display:flex;flex-direction:column;overflow:hidden}
.plot-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--bd)}
.plot-title{font-weight:700;font-size:14px}
#plot{width:100%;height:100%;display:block;background:#fbfdff}
.side{display:flex;flex-direction:column;gap:10px;min-height:0}
.box{padding:10px}
.box h3{font-size:14px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:120px 1fr;gap:7px;font-size:13px;align-items:center}
.k{color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.table-wrap{flex:1;min-height:0;overflow:auto;border-top:1px solid var(--bd)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{padding:6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:sticky;top:0;background:#f5f8fd;color:#344054}
th:first-child,td:first-child{text-align:left}
.toast{position:fixed;right:14px;bottom:14px;max-width:460px;padding:9px 11px;border:1px solid var(--bd);border-radius:7px;background:#fff;box-shadow:0 12px 28px rgba(15,23,42,.12);font-size:13px;opacity:0;transform:translateY(12px);transition:.18s}
.toast.show{opacity:1;transform:none}
@media(max-width:1120px){.main{grid-template-columns:1fr}.side{min-height:420px}}
</style>
</head>
<body>
<div class="top">
  <div class="left">
    <div class="title">加速刹车采集器</div>
    <div id="conn" class="tag warn">等待连接</div>
    <div id="payload" class="tag">Payload:--</div>
    <div id="sampleTag" class="tag">采样:10ms</div>
    <div id="phaseTag" class="tag">阶段:idle</div>
    <div id="rowsTag" class="tag">样本:0</div>
  </div>
  <div class="right">
    <label>目标速度(mm/s,+前/-反) <input id="targetSpeed" type="number" step="10" value="500" /></label>
    <label>刹车目标速度(mm/s) <input id="brakeTargetSpeed" type="number" step="10" value="0" /></label>
    <label><input id="multiPid" type="checkbox" checked /> 多 PID</label>
    <button id="startBtn" class="primary">开始</button>
    <button id="forceBrakeBtn">开始刹车</button>
    <button id="cancelBtn" class="danger">停止</button>
    <button id="zeroBtn">零速</button>
    <button id="clearBtn">清屏</button>
  </div>
</div>
<div class="main">
  <div class="panel plot-panel">
    <div class="plot-head">
      <div class="plot-title">实时前进速度 / 加速度</div>
      <div class="left">
        <div id="speedTag" class="tag">|Vx|:-- mm/s</div>
        <div id="accelTag" class="tag">A:-- mm/s^2</div>
        <div id="distTag" class="tag">XY:--</div>
      </div>
    </div>
    <canvas id="plot"></canvas>
  </div>
  <div class="side">
    <div class="panel box">
      <h3>本次实验</h3>
      <div class="grid">
        <div class="k">状态</div><div id="phase">-</div>
        <div class="k">日志</div><div id="logPath">-</div>
        <div class="k">目标速度</div><div id="targetNow">-</div>
        <div class="k">车端速度命令</div><div id="vehicleNow">-</div>
        <div class="k">刹车目标速度</div><div id="brakeTargetNow">-</div>
        <div class="k">刹车车端命令</div><div id="brakeVehicleNow">-</div>
        <div class="k">车端实时目标</div><div id="carTargetNow">-</div>
        <div class="k">换算系数</div><div id="scaleNow">-</div>
        <div class="k">预设 PID</div><div id="pidNow">-</div>
        <div class="k">车端 PID</div><div id="telemetryPidNow">-</div>
        <div class="k">姿态角</div><div id="attNow">-</div>
        <div class="k">陀螺仪</div><div id="gyroNow">-</div>
      </div>
      <div class="actions">
        <div id="lastAck" class="tag">ACK:--</div>
      </div>
    </div>
    <div class="panel table-wrap">
      <table>
        <thead>
          <tr>
            <th>阶段</th>
            <th>|Vx|(mm/s)</th>
            <th>车端目标</th>
            <th>PID</th>
            <th>Roll</th>
            <th>Pitch</th>
            <th>Yaw</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const S={api:false,frames:[],maxFrames:420,last:null,status:null};
const POLL_DATA_MS=10;
const POLL_STATUS_MS=320;
const E={conn,payload,sampleTag,phaseTag,rowsTag,targetSpeed,brakeTargetSpeed,multiPid,startBtn,forceBrakeBtn,cancelBtn,zeroBtn,clearBtn,plot,speedTag,accelTag,distTag,phase,logPath,targetNow,vehicleNow,brakeTargetNow,brakeVehicleNow,carTargetNow,scaleNow,pidNow,telemetryPidNow,attNow,gyroNow,lastAck,rows,toast};
const ctx=E.plot.getContext('2d');
function tip(t){E.toast.textContent=t;E.toast.classList.add('show');clearTimeout(tip.t);tip.t=setTimeout(()=>E.toast.classList.remove('show'),3200)}
function num(v,d=2){const n=Number(v);return Number.isFinite(n)?n.toFixed(d):'--'}
function cls(el,name,text){el.className='tag '+name;el.textContent=text}
function phaseName(p){return p||'idle'}
function resize(){const dpr=window.devicePixelRatio||1;const r=E.plot.getBoundingClientRect();E.plot.width=Math.max(1,Math.floor(r.width*dpr));E.plot.height=Math.max(1,Math.floor(r.height*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function feed(frames){
  if(!Array.isArray(frames)||!frames.length)return;
  for(const f of frames){
    const prev=S.last;
    const vx=Number(f.vx_body);
    const now=performance.now()/1000;
    const forwardV=Number.isFinite(vx)?Math.abs(vx):0;
    const currentPhase=(S.status&&S.status.experiment)?S.status.experiment.phase:'-';
    let ax=0;
    if(prev&&Number.isFinite(forwardV)&&Number.isFinite(prev.forward_v)){const dt=Math.max(0.001,now-prev.t);ax=(forwardV-prev.forward_v)/dt}
    const item={...f,t:now,vx:Number.isFinite(vx)?vx:0,forward_v:forwardV,ax,collector_phase:currentPhase};
    S.frames.push(item);
    S.last=item;
  }
  if(S.frames.length>S.maxFrames)S.frames.splice(0,S.frames.length-S.maxFrames);
  syncLast();
  draw();
}
function syncLast(){
  const f=S.last;
  if(!f)return;
  E.speedTag.textContent='|Vx|:'+num(f.forward_v,2)+' mm/s';
  E.accelTag.textContent='A:'+num(f.ax,2)+' mm/s^2';
  E.distTag.textContent='XY(mm):'+num(f.nav_x,0)+','+num(f.nav_y,0);
  E.carTargetNow.textContent=num(f.target_speed,2);
  E.telemetryPidNow.textContent=String(f.pid_mode??'-');
  E.attNow.textContent=num(f.att_roll,1)+' / '+num(f.att_pitch,1)+' / '+num(f.att_yaw,1);
  E.gyroNow.textContent=num(f.imu_gyro_x,3)+' / '+num(f.imu_gyro_y,3)+' / '+num(f.imu_gyro_z,3);
  const recent=S.frames.slice(-80).reverse().map(row=>`<tr><td>${phaseName(row.collector_phase)}</td><td>${num(row.forward_v,1)}</td><td>${num(row.target_speed,1)}</td><td>${row.pid_mode??''}</td><td>${num(row.att_roll,1)}</td><td>${num(row.att_pitch,1)}</td><td>${num(row.att_yaw,1)}</td></tr>`).join('');
  E.rows.innerHTML=recent;
}
function drawGrid(w,h){
  ctx.strokeStyle='#e7edf5';ctx.lineWidth=1;
  for(let x=40;x<w;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=30;y<h;y+=55){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
}
function drawSeries(vals,color,min,max,w,h){
  if(vals.length<2)return;
  const pad=28, gw=w-pad*2, gh=h-pad*2;
  ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
  vals.forEach((v,i)=>{const x=pad+(i/(vals.length-1))*gw;const y=pad+(1-(v-min)/(max-min))*gh;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)});
  ctx.stroke();
}
function draw(){
  const r=E.plot.getBoundingClientRect(),w=r.width,h=r.height;
  ctx.clearRect(0,0,w,h);drawGrid(w,h);
  const vals=S.frames.slice(-S.maxFrames);
  if(!vals.length)return;
  const speeds=vals.map(v=>v.forward_v);
  const accels=vals.map(v=>v.ax);
  let min=Math.min(...speeds,...accels),max=Math.max(...speeds,...accels);
  if(Math.abs(max-min)<1){max+=1;min-=1}
  ctx.fillStyle='#667085';ctx.font='12px Microsoft YaHei';ctx.fillText('|Vx|',12,18);ctx.fillText('A',70,18);
  ctx.fillStyle='#2563eb';ctx.fillRect(54,11,10,3);ctx.fillStyle='#c43d3d';ctx.fillRect(116,11,10,3);
  drawSeries(speeds,'#2563eb',min,max,w,h);
  drawSeries(accels,'#c43d3d',min,max,w,h);
}
async function pollData(){
  if(!S.api||!window.pywebview||!window.pywebview.api){setTimeout(pollData,POLL_DATA_MS);return}
  try{feed(await window.pywebview.api.get_new_data())}catch(_){}
  setTimeout(pollData,POLL_DATA_MS)
}
async function pollStatus(){
  if(!S.api||!window.pywebview||!window.pywebview.api){setTimeout(pollStatus,300);return}
  try{
    const s=await window.pywebview.api.get_status();S.status=s;
    if(s.server_error)cls(E.conn,'bad',s.server_error);else if(s.connected)cls(E.conn,(s.data_fresh||s.frame_fresh)?'ok':'warn',s.peer||'已连接');else cls(E.conn,'warn','等待连接');
    E.payload.textContent='Payload:'+(s.last_payload_size||'--');
    E.sampleTag.textContent='采样:'+(s.host_sample_period_ms||POLL_DATA_MS)+'ms';
    const ex=s.experiment||{};
    E.phase.textContent=phaseName(ex.phase);
    E.phaseTag.textContent='阶段:'+phaseName(ex.phase);
    E.rowsTag.textContent='样本:'+(ex.rows||0);
    E.logPath.textContent=ex.csv_path||'-';
    const hasRun=!!ex.run_id||!!ex.active||Number(ex.target_forward_speed_mm_s);
    const targetMotion=Number.isFinite(Number(ex.target_motion_speed_mm_s))?ex.target_motion_speed_mm_s:ex.target_forward_speed_mm_s;
    E.targetNow.textContent=hasRun?num(targetMotion,1)+' mm/s':'-';
    E.vehicleNow.textContent=hasRun?num(ex.vehicle_speed_cmd,2):'-';
    E.brakeTargetNow.textContent=hasRun?num(ex.brake_target_speed_mm_s,1)+' mm/s':'-';
    E.brakeVehicleNow.textContent=hasRun?num(ex.brake_vehicle_speed_cmd,2):'-';
    E.scaleNow.textContent=Number.isFinite(Number(ex.speed_to_mm_s))?num(ex.speed_to_mm_s,3)+' mm/s/cmd':'-';
    E.pidNow.textContent=ex.multi_pid?'多 PID':'普通 PID';
    E.startBtn.disabled=!!ex.active;
    E.forceBrakeBtn.disabled=!ex.active||ex.phase==='brake';
    E.cancelBtn.disabled=!ex.active;
    if(s.acks&&s.acks.length){const a=s.acks[s.acks.length-1];E.lastAck.textContent='ACK:0x'+Number(a.control).toString(16).padStart(2,'0')+' / '+a.status}
  }catch(_){}
  setTimeout(pollStatus,POLL_STATUS_MS)
}
function initApi(){window.addEventListener('pywebviewready',()=>{S.api=true});const t=setInterval(()=>{if(window.pywebview&&window.pywebview.api){S.api=true;clearInterval(t)}},80)}
function initButtons(){
  E.startBtn.onclick=async()=>{try{const r=await window.pywebview.api.start_experiment(E.targetSpeed.value,E.multiPid.checked,E.brakeTargetSpeed.value);tip(r&&r.msg?r.msg:(r&&r.success?'已开始':'开始失败'))}catch(e){tip('开始失败: '+(e.message||e))}};
  E.forceBrakeBtn.onclick=async()=>{try{const r=await window.pywebview.api.force_brake_experiment();tip(r&&r.msg?r.msg:(r&&r.success?'已进入刹车':'开始刹车失败'))}catch(e){tip('开始刹车失败: '+(e.message||e))}};
  E.cancelBtn.onclick=async()=>{try{const r=await window.pywebview.api.cancel_experiment();tip(r&&r.error?r.error:'已停止')}catch(e){tip('停止失败: '+(e.message||e))}};
  E.zeroBtn.onclick=async()=>{try{const r=await window.pywebview.api.send_zero_speed();tip(r&&r.msg?r.msg:'已发送零速')}catch(e){tip('发送失败: '+(e.message||e))}};
  E.clearBtn.onclick=async()=>{S.frames=[];S.last=null;E.rows.innerHTML='';draw();try{await window.pywebview.api.clear_history()}catch(_){}};
}
function boot(){initApi();initButtons();resize();pollData();pollStatus();window.addEventListener('resize',resize)}
document.addEventListener('DOMContentLoaded',boot);
</script>
</body>
</html>
