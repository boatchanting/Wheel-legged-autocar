<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNSS 与惯性导航数据可视化分析工具</title>
    
    <!-- 引入外部库 (CDN) -->
    <!-- PapaParse: CSV 解析 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <!-- Plotly.js: 笛卡尔坐标系图表 -->
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <!-- Leaflet: 地图可视化 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <!-- Proj4js: 坐标投影转换 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.7.2/proj4.js"></script>

    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f4f6f9;
            --panel-bg: #ffffff;
            --border-color: #bdc3c7;
            --text-color: #333333;
        }

        body {
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 1400px;
            background-color: var(--panel-bg);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
            padding: 20px;
            box-sizing: border-box;
        }

        header {
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--primary-color);
            margin: 0;
            font-size: 24px;
            font-weight: 600;
        }

        .upload-section {
            border: 2px dashed var(--border-color);
            border-radius: 6px;
            padding: 40px;
            text-align: center;
            background-color: #fafafa;
            transition: border-color 0.3s, background-color 0.3s;
            margin-bottom: 20px;
        }

        .upload-section.drag-over {
            border-color: var(--accent-color);
            background-color: #eaf6ff;
        }

        .upload-section p {
            margin: 0;
            font-size: 16px;
            color: #7f8c8d;
        }

        .visualization-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 15px;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        #map-container {
            height: 500px;
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
        }

        #chart-container {
            width: 100%;
            height: 500px;
        }

        .status-bar {
            margin-top: 10px;
            padding: 10px;
            background-color: #ecf0f1;
            border-radius: 4px;
            font-size: 14px;
            color: #7f8c8d;
        }

        .error-msg {
            color: #e74c3c;
            font-weight: bold;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        @media (max-width: 1024px) {
            .visualization-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>GNSS 与惯性导航数据可视化分析工具</h1>
    </header>

    <div class="upload-section" id="drop-zone">
        <p>请将 CSV 数据文件拖拽至此处，或点击选择文件</p>
        <input type="file" id="file-input" accept=".csv" style="display: none;">
    </div>

    <div class="status-bar" id="status-bar">
        等待数据上传...
    </div>

    <div class="visualization-grid">
        <!-- 地图可视化面板 -->
        <div class="panel full-width">
            <div class="panel-title">原始 GPS 轨迹 (WGS-84 经纬度)</div>
            <div id="map-container"></div>
        </div>

        <!-- 笛卡尔坐标可视化面板 -->
        <div class="panel full-width">
            <div class="panel-title">投影坐标与惯性导航轨迹对比 (高斯 - 克吕格投影 vs INS)</div>
            <div id="chart-container"></div>
            <div style="font-size: 12px; color: #7f8c8d; margin-top: 10px;">
                注：GPS 数据已转换为高斯 - 克吕格投影坐标并归一化至起点 (0,0) 以便与惯性导航数据对比。
                惯性导航 X 轴已取反以匹配北向正方向（假设初始航向为正北）。
            </div>
        </div>
    </div>
</div>

<script>
    /**
     * 全局变量与配置
     */
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const statusBar = document.getElementById('status-bar');
    let map = null;
    let gpsLayerGroup = null;

    /**
     * 初始化拖拽上传事件监听
     */
    function initUploadEvents() {
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-over'), false);
        });

        dropZone.addEventListener('drop', handleDrop, false);
        dropZone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', (e) => handleFiles(e.target.files));
    }

    /**
     * 处理文件拖拽
     */
    function handleDrop(e) {
        const dt = e.dataTransfer;
        const files = dt.files;
        handleFiles(files);
    }

    /**
     * 处理文件读取与解析
     */
    function handleFiles(files) {
        if (files.length === 0) return;
        const file = files[0];
        
        if (file.type && file.type !== "text/csv" && !file.name.endsWith('.csv')) {
            updateStatus("错误：请上传 CSV 格式文件。", true);
            return;
        }

        updateStatus(`正在解析文件：${file.name} ...`);

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            dynamicTyping: true,
            complete: function(results) {
                if (results.errors.length > 0) {
                    console.warn("CSV 解析警告:", results.errors);
                }
                processData(results.data);
            },
            error: function(err) {
                updateStatus(`解析失败：${err.message}`, true);
            }
        });
    }

    /**
     * 数据处理核心逻辑
     */
    function processData(data) {
        if (!data || data.length === 0) {
            updateStatus("错误：文件内容为空。", true);
            return;
        }

        // 验证必要字段
        const requiredFields = ['latitude', 'longitude', 'nav_x', 'nav_y'];
        const firstRow = data[0];
        for (const field of requiredFields) {
            if (!(field in firstRow)) {
                updateStatus(`错误：CSV 文件中缺少必要字段 "${field}"。`, true);
                return;
            }
        }

        updateStatus("数据解析完成，正在生成可视化...");

        // 过滤无效数据
        const validData = data.filter(row => 
            row.latitude && row.longitude && 
            !isNaN(row.latitude) && !isNaN(row.longitude)
        );

        if (validData.length === 0) {
            updateStatus("错误：未找到有效的经纬度数据。", true);
            return;
        }

        // 1. 初始化地图
        initMap(validData);

        // 2. 计算高斯 - 克吕格投影并绘图
        plotCartesianComparison(validData);
        
        updateStatus(`可视化完成。共处理 ${validData.length} 条有效数据。`);
    }

    /**
     * 初始化 Leaflet 地图
     */
    function initMap(data) {
        if (map) {
            map.remove();
        }
        
        // 取中间点作为地图中心
        const midIndex = Math.floor(data.length / 2);
        const centerLat = data[midIndex].latitude;
        const centerLon = data[midIndex].longitude;

        map = L.map('map-container').setView([centerLat, centerLon], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        if (gpsLayerGroup) {
            gpsLayerGroup.clearLayers();
        } else {
            gpsLayerGroup = L.layerGroup().addTo(map);
        }

        const latlngs = data.map(row => [row.latitude, row.longitude]);
        const polyline = L.polyline(latlngs, {color: 'blue', weight: 3}).addTo(gpsLayerGroup);
        map.fitBounds(polyline.getBounds());
        
        // 添加起点标记
        L.marker([data[0].latitude, data[0].longitude]).addTo(gpsLayerGroup)
            .bindPopup("起点").openPopup();
    }

    /**
     * 高斯 - 克吕格投影计算与 Plotly 绘图
     */
    function plotCartesianComparison(data) {
        // 1. 确定投影带号 (基于第一条数据的经度)
        const firstLon = data[0].longitude;
        // 使用 3 度带以提高精度
        const zone = Math.round(firstLon / 3);
        const centralMeridian = zone * 3;
        
        // 定义 Proj4 投影字符串 (WGS84 椭球)
        // +x_0=500000 为东伪偏移，避免负值
        const projDefinition = `+proj=tmerc +lat_0=0 +lon_0=${centralMeridian} +k=1 +x_0=500000 +y_0=0 +datum=WGS84 +units=m +no_defs`;
        
        // 注册投影
        proj4.defs(`GK_Zone_${zone}`, projDefinition);

        // 2. 坐标转换与数据准备
        const gpsX = []; // 北向 (Northing)
        const gpsY = []; // 东向 (Easting)
        const insX = []; // 北向 (转换后)
        const insY = []; // 东向 (转换后)

        // 记录起点用于归一化
        let startNorthing = 0;
        let startEasting = 0;

        data.forEach((row, index) => {
            // --- GPS 高斯投影 ---
            // proj4 返回 [easting, northing]
            // 注意：测量坐标系中 X 为北，Y 为东。Proj4 输出 x 为东，y 为北。
            const projected = proj4(`GK_Zone_${zone}`, [row.longitude, row.latitude]);
            const easting = projected[0];
            const northing = projected[1];

            if (index === 0) {
                startNorthing = northing;
                startEasting = easting;
            }

            // 归一化至起点 (0,0) 以便与 INS 对比
            gpsX.push(northing - startNorthing);
            gpsY.push(easting - startEasting);

            // --- 惯性导航数据转换 ---
            // nav_x: mm, 向后为正。向前运动则 nav_x 减小（或为负）。
            // 为匹配北向为正，取反：-nav_x
            // nav_y: mm, 向右为正。匹配东向为正，保持不变。
            // 单位转换：mm -> m
            const insX_m = -(row.nav_x / 1000.0); 
            const insY_m = (row.nav_y / 1000.0);

            insX.push(insX_m);
            insY.push(insY_m);
        });

        // 3. 使用 Plotly 绘图
        const traceGPS = {
            x: gpsY, // 横轴为东向 (Y)
            y: gpsX, // 纵轴为北向 (X)
            mode: 'lines',
            type: 'scatter',
            name: 'GPS 轨迹 (高斯投影归一化)',
            line: { color: '#3498db', width: 2 }
        };

        const traceINS = {
            x: insY, // 横轴为东向 (Y)
            y: insX, // 纵轴为北向 (X)
            mode: 'lines',
            type: 'scatter',
            name: '惯性导航轨迹 (相对位置)',
            line: { color: '#e74c3c', width: 2, dash: 'dot' }
        };

        const layout = {
            title: `轨迹对比 (中央子午线：${centralMeridian}°E, 3 度带)`,
            xaxis: { title: '东向距离 (米)', showgrid: true, zeroline: true },
            yaxis: { title: '北向距离 (米)', showgrid: true, zeroline: true, scaleanchor: "x" },
            hovermode: 'closest',
            legend: { x: 0, y: 1 },
            margin: { t: 50, r: 20, l: 60, b: 50 }
        };

        const config = { responsive: true, displayModeBar: true };

        Plotly.newPlot('chart-container', [traceGPS, traceINS], layout, config);
    }

    /**
     * 更新状态栏信息
     */
    function updateStatus(message, isError = false) {
        statusBar.textContent = message;
        if (isError) {
            statusBar.classList.add('error-msg');
        } else {
            statusBar.classList.remove('error-msg');
        }
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', initUploadEvents);

</script>

</body>
</html>
