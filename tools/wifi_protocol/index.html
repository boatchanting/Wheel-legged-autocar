<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNSS/惯导 协议分析仪</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-deep: #050810;
            --bg-primary: #0a0f1a;
            --bg-secondary: #0f1525;
            --bg-card: #141c2d;
            --bg-elevated: #1a2338;
            --border: #243049;
            --border-bright: #2d3d5a;
            --text-primary: #e4e9f2;
            --text-secondary: #7a8ba8;
            --text-muted: #4a5a75;
            --accent: #00ddb3;
            --accent-dim: rgba(0, 221, 179, 0.15);
            --accent-glow: rgba(0, 221, 179, 0.4);
            --warning: #f5a623;
            --error: #f25c5c;
            --success: #2dd4a0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Space Grotesk', sans-serif;
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Background Pattern */
        .bg-pattern {
            position: fixed;
            inset: 0;
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0, 221, 179, 0.08), transparent),
                radial-gradient(circle at 20% 80%, rgba(59, 158, 255, 0.05), transparent),
                linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-primary) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .grid-overlay {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(36, 48, 73, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(36, 48, 73, 0.3) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
        }

        /* Status Badge */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .status-badge.connected {
            background: rgba(0, 221, 179, 0.12);
            border: 1px solid rgba(0, 221, 179, 0.3);
            color: var(--accent);
        }

        .status-badge.disconnected {
            background: rgba(245, 92, 92, 0.12);
            border: 1px solid rgba(245, 92, 92, 0.3);
            color: var(--error);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        .status-badge.connected .status-dot {
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent-glow);
        }

        .status-badge.disconnected .status-dot {
            background: var(--error);
            box-shadow: 0 0 12px rgba(245, 92, 92, 0.4);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(0.9); }
        }

        /* Card Styles */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .card:hover {
            border-color: var(--border-bright);
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, var(--bg-elevated), var(--bg-card));
        }

        /* Channel list */
        .channel-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .channel-item:last-child {
            border-bottom: none;
        }

        .channel-item:hover {
            background: var(--bg-elevated);
        }

        .channel-item.selected {
            background: var(--accent-dim);
        }

        .channel-checkbox {
            width: 20px;
            height: 20px;
            border: 2px solid var(--border-bright);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .channel-item.selected .channel-checkbox {
            border-color: var(--channel-color);
            background: var(--channel-color);
        }

        .channel-checkbox svg {
            width: 12px;
            height: 12px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .channel-item.selected .channel-checkbox svg {
            opacity: 1;
        }

        .channel-color-indicator {
            width: 4px;
            height: 32px;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .channel-name {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
        }

        .channel-value {
            font-size: 11px;
            color: var(--text-secondary);
            margin-left: auto;
            font-family: 'JetBrains Mono', monospace;
            text-align: right;
            max-width: 140px;
            word-break: break-all;
        }

        /* Chart Canvas */
        .chart-container {
            position: relative;
            background: var(--bg-secondary);
            border-radius: 8px;
            overflow: hidden;
        }

        .chart-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), #00b89c);
            color: var(--bg-deep);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            border-color: var(--border-bright);
            background: var(--bg-card);
        }

        .btn-danger {
            background: rgba(245, 92, 92, 0.15);
            border: 1px solid rgba(245, 92, 92, 0.3);
            color: var(--error);
        }

        .btn-danger:hover {
            background: rgba(245, 92, 92, 0.25);
        }

        /* Stats Grid */
        .stat-card {
            background: linear-gradient(135deg, var(--bg-card), var(--bg-elevated));
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-bright);
        }

        .stat-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            word-break: break-all;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-bright);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes dataFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        .data-flow-indicator {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            background-size: 200% 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .data-flow-indicator.active {
            opacity: 1;
            animation: dataFlow 1s linear infinite;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
            max-width: 400px;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            background: rgba(0, 221, 179, 0.15);
            border: 1px solid rgba(0, 221, 179, 0.3);
            color: var(--accent);
        }

        .toast.error {
            background: rgba(245, 92, 92, 0.15);
            border: 1px solid rgba(245, 92, 92, 0.3);
            color: var(--error);
        }

        /* Legend */
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--bg-elevated);
            border-radius: 6px;
            font-size: 12px;
        }

        .legend-color {
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        /* Tooltip */
        .tooltip {
            position: absolute;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 11px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 100;
            white-space: nowrap;
            font-family: 'JetBrains Mono', monospace;
        }

        .tooltip.visible {
            opacity: 1;
        }

        /* Info row */
        .info-row {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .info-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        .info-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            word-break: break-all;
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="grid-overlay"></div>

    <div class="relative z-10 min-h-screen p-6">
        <!-- Header -->
        <header class="flex items-center justify-between mb-6 animate-in">
            <div class="flex items-center gap-4">
                <div>
                    <h1 class="text-2xl font-bold tracking-tight">GNSS/惯导 协议分析仪</h1>
                    <p class="text-sm text-[var(--text-secondary)] mt-1">实时数据可视化与监控</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div id="statusBadge" class="status-badge disconnected">
                    <span class="status-dot"></span>
                    <span id="statusText">未连接</span>
                </div>
                <div class="text-sm text-[var(--text-secondary)] mono">
                    <span id="packetCount">0</span> 包
                </div>
            </div>
        </header>

        <!-- Stats Row -->
        <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-6 animate-in" style="animation-delay: 0.1s;">
            <div class="stat-card">
                <div class="stat-label">导航 X (m)</div>
                <div class="stat-value" id="statNavX" style="color: #00ffcc;">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">导航 Y (m)</div>
                <div class="stat-value" id="statNavY" style="color: #00aaff;">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">速度</div>
                <div class="stat-value" id="statSpeed" style="color: #ff6b35;">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">航向 (°)</div>
                <div class="stat-value" id="statDir" style="color: #e040fb;">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">高度</div>
                <div class="stat-value" id="statHeight" style="color: #ffdd00;">--</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">卫星数</div>
                <div class="stat-value" id="statSat" style="color: #ff4081;">--</div>
            </div>
        </div>

        <!-- Main Content -->
        <div class="flex gap-6 animate-in" style="animation-delay: 0.2s;">
            <!-- Sidebar - Channel Selection -->
            <div class="w-80 flex-shrink-0">
                <div class="card">
                    <div class="card-header flex items-center justify-between">
                        <h2 class="font-semibold">数据通道</h2>
                        <button id="selectAllBtn" class="text-xs text-[var(--accent)] hover:underline">全选/取消</button>
                    </div>
                    <div id="channelList" class="max-h-[500px] overflow-y-auto">
                        <!-- Channels will be populated by JS -->
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="mt-4 space-y-3">
                    <button id="saveBtn" class="btn btn-primary w-full">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                            <polyline points="17,21 17,13 7,13 7,21"/>
                            <polyline points="7,3 7,8 15,8"/>
                        </svg>
                        保存数据
                    </button>
                    <button id="clearBtn" class="btn btn-danger w-full">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3,6 5,6 21,6"/>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
                        </svg>
                        清除数据
                    </button>
                </div>

                <!-- Info Panel -->
                <div class="card mt-4 p-4">
                    <h3 class="text-sm font-semibold mb-3 text-[var(--text-secondary)]">连接信息</h3>
                    <div class="space-y-2 text-xs">
                        <div class="flex justify-between">
                            <span class="text-[var(--text-muted)]">服务器</span>
                            <span class="mono text-[var(--text-secondary)]">192.168.137.1:8086</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-[var(--text-muted)]">数据点</span>
                            <span class="mono text-[var(--text-secondary)]" id="dataPointCount">0</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-[var(--text-muted)]">更新率</span>
                            <span class="mono text-[var(--text-secondary)]" id="updateRate">-- Hz</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Chart Area -->
            <div class="flex-1">
                <div class="card">
                    <div class="card-header flex items-center justify-between flex-wrap gap-3">
                        <div class="flex items-center gap-4">
                            <h2 class="font-semibold">波形显示</h2>
                            <div id="legend" class="flex gap-2 flex-wrap">
                                <!-- Legend items -->
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button id="zoomInBtn" class="btn btn-secondary py-1 px-3 text-xs">放大</button>
                            <button id="zoomOutBtn" class="btn btn-secondary py-1 px-3 text-xs">缩小</button>
                            <button id="resetZoomBtn" class="btn btn-secondary py-1 px-3 text-xs">重置</button>
                        </div>
                    </div>
                    <div class="chart-container relative" style="height: 420px;">
                        <div id="dataFlowIndicator" class="data-flow-indicator"></div>
                        <canvas id="waveformCanvas" class="chart-canvas"></canvas>
                        <div id="tooltip" class="tooltip"></div>
                    </div>
                </div>

                <!-- Time Display -->
                <div class="card mt-4">
                    <div class="p-4 flex items-center justify-between flex-wrap gap-4">
                        <div class="flex items-center gap-6 flex-wrap">
                            <div class="info-row">
                                <span class="info-label">UTC时间</span>
                                <div class="info-value" id="utcTime">--:--:--</div>
                            </div>
                            <div class="info-row">
                                <span class="info-label">纬度</span>
                                <div class="info-value" id="latDisplay" style="color: #00ffcc;">--</div>
                            </div>
                            <div class="info-row">
                                <span class="info-label">经度</span>
                                <div class="info-value" id="lonDisplay" style="color: #00aaff;">--</div>
                            </div>
                        </div>
                        <div class="text-right info-row">
                            <span class="info-label">定位状态</span>
                            <div class="info-value" id="stateDisplay">--</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast"></div>

    <script>
        // ========================================
        // 配置与状态
        // ========================================
        const MAX_POINTS = 5000;

        // 每个通道独立的鲜明颜色
        const CHANNEL_CONFIG = [
            { key: 'nav_x',      name: '导航 X',      unit: 'm',   color: '#00ffcc', decimals: 6 },
            { key: 'nav_y',      name: '导航 Y',      unit: 'm',   color: '#00aaff', decimals: 6 },
            { key: 'speed',      name: '速度',        unit: 'm/s', color: '#ff6b35', decimals: 6 },
            { key: 'direction',  name: '航向',        unit: '°',   color: '#e040fb', decimals: 6 },
            { key: 'height',     name: '高度',        unit: 'm',   color: '#ffdd00', decimals: 6 },
            { key: 'latitude',   name: '纬度',        unit: '°',   color: '#00e676', decimals: 10 },
            { key: 'longitude',  name: '经度',        unit: '°',   color: '#ff4081', decimals: 10 },
            { key: 'sat_used',   name: '卫星数',      unit: '',    color: '#ff9100', decimals: 0 }
        ];

        // 全局状态 - 先初始化所有变量
        let chartData = {};
        let selectedChannels = new Set(['nav_x', 'nav_y', 'speed']);
        let isConnected = false;
        let packetCount = 0;
        let lastUpdateTime = 0;
        let updateCount = 0;
        let zoomLevel = 1;
        let panOffset = 0;
        let isDragging = false;
        let dragStartX = 0;
        let lastDragOffset = 0;

        // Canvas 相关
        let canvas = null;
        let ctx = null;
        let animationId = null;

        // 初始化图表数据存储
        CHANNEL_CONFIG.forEach(ch => {
            chartData[ch.key] = [];
        });

        // ========================================
        // DOM 元素引用
        // ========================================
        let statusBadge, statusText, packetCountEl, dataPointCountEl;
        let updateRateEl, channelListEl, legendEl, toastEl;
        let tooltip, dataFlowIndicator;
        let statNavX, statNavY, statSpeed, statDir, statHeight, statSat;
        let utcTimeEl, latDisplayEl, lonDisplayEl, stateDisplayEl;

        // ========================================
        // 初始化
        // ========================================
        document.addEventListener('DOMContentLoaded', () => {
            // 获取所有 DOM 引用
            statusBadge = document.getElementById('statusBadge');
            statusText = document.getElementById('statusText');
            packetCountEl = document.getElementById('packetCount');
            dataPointCountEl = document.getElementById('dataPointCount');
            updateRateEl = document.getElementById('updateRate');
            channelListEl = document.getElementById('channelList');
            legendEl = document.getElementById('legend');
            toastEl = document.getElementById('toast');
            tooltip = document.getElementById('tooltip');
            dataFlowIndicator = document.getElementById('dataFlowIndicator');

            statNavX = document.getElementById('statNavX');
            statNavY = document.getElementById('statNavY');
            statSpeed = document.getElementById('statSpeed');
            statDir = document.getElementById('statDir');
            statHeight = document.getElementById('statHeight');
            statSat = document.getElementById('statSat');

            utcTimeEl = document.getElementById('utcTime');
            latDisplayEl = document.getElementById('latDisplay');
            lonDisplayEl = document.getElementById('lonDisplay');
            stateDisplayEl = document.getElementById('stateDisplay');

            // 初始化 Canvas
            canvas = document.getElementById('waveformCanvas');
            ctx = canvas.getContext('2d');

            // 初始化界面
            initChannelList();
            initLegend();
            initEventListeners();
            resizeCanvas();
            
            // 启动动画循环
            startAnimation();
            
            // 启动数据轮询
            startDataPolling();

            // 监听窗口大小变化
            window.addEventListener('resize', resizeCanvas);
        });

        // ========================================
        // 界面初始化
        // ========================================
        function initChannelList() {
            if (!channelListEl) return;
            
            channelListEl.innerHTML = CHANNEL_CONFIG.map((ch, i) => `
                <div class="channel-item ${selectedChannels.has(ch.key) ? 'selected' : ''}" 
                     data-channel="${ch.key}"
                     style="--channel-color: ${ch.color}">
                    <div class="channel-checkbox">
                        <svg viewBox="0 0 24 24" fill="none" stroke="#0a0f1a" stroke-width="3">
                            <polyline points="20,6 9,17 4,12"/>
                        </svg>
                    </div>
                    <div class="channel-color-indicator" style="background: ${ch.color}"></div>
                    <span class="channel-name">${ch.name}</span>
                    <span class="channel-value" id="ch-val-${ch.key}">--</span>
                </div>
            `).join('');

            // 绑定点击事件
            channelListEl.querySelectorAll('.channel-item').forEach(item => {
                item.addEventListener('click', () => {
                    const key = item.dataset.channel;
                    if (selectedChannels.has(key)) {
                        selectedChannels.delete(key);
                        item.classList.remove('selected');
                    } else {
                        selectedChannels.add(key);
                        item.classList.add('selected');
                    }
                    initLegend();
                });
            });
        }

        function initLegend() {
            if (!legendEl) return;
            
            legendEl.innerHTML = Array.from(selectedChannels).map(key => {
                const ch = CHANNEL_CONFIG.find(c => c.key === key);
                return ch ? `
                    <div class="legend-item">
                        <div class="legend-color" style="background: ${ch.color}"></div>
                        <span>${ch.name}</span>
                    </div>
                ` : '';
            }).join('');
        }

        function initEventListeners() {
            // 保存按钮
            document.getElementById('saveBtn')?.addEventListener('click', async () => {
                try {
                    const result = await pywebview.api.save_csv();
                    showToast(result.success ? 'success' : 'error', result.msg);
                } catch (e) {
                    showToast('error', '保存失败: ' + e.message);
                }
            });

            // 清除按钮
            document.getElementById('clearBtn')?.addEventListener('click', async () => {
                try {
                    await pywebview.api.clear_data();
                    clearAllData();
                    showToast('success', '数据已清除');
                } catch (e) {
                    showToast('error', '清除失败: ' + e.message);
                }
            });

            // 全选按钮
            document.getElementById('selectAllBtn')?.addEventListener('click', () => {
                const allSelected = selectedChannels.size === CHANNEL_CONFIG.length;
                if (allSelected) {
                    selectedChannels.clear();
                } else {
                    CHANNEL_CONFIG.forEach(ch => selectedChannels.add(ch.key));
                }
                initChannelList();
                initLegend();
            });

            // 缩放按钮
            document.getElementById('zoomInBtn')?.addEventListener('click', () => {
                zoomLevel = Math.min(zoomLevel * 1.5, 10);
            });

            document.getElementById('zoomOutBtn')?.addEventListener('click', () => {
                zoomLevel = Math.max(zoomLevel / 1.5, 1);
            });

            document.getElementById('resetZoomBtn')?.addEventListener('click', () => {
                zoomLevel = 1;
                panOffset = 0;
            });

            // Canvas 交互
            if (canvas) {
                canvas.addEventListener('mousedown', (e) => {
                    isDragging = true;
                    dragStartX = e.clientX;
                    lastDragOffset = panOffset;
                    canvas.style.cursor = 'grabbing';
                });

                canvas.addEventListener('mousemove', (e) => {
                    if (isDragging) {
                        const dx = e.clientX - dragStartX;
                        panOffset = lastDragOffset + dx / zoomLevel;
                    }
                    updateTooltip(e);
                });

                canvas.addEventListener('mouseup', () => {
                    isDragging = false;
                    canvas.style.cursor = 'crosshair';
                });

                canvas.addEventListener('mouseleave', () => {
                    isDragging = false;
                    canvas.style.cursor = 'crosshair';
                    if (tooltip) tooltip.classList.remove('visible');
                });

                canvas.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const delta = e.deltaY > 0 ? 0.9 : 1.1;
                    zoomLevel = Math.max(1, Math.min(10, zoomLevel * delta));
                });

                canvas.style.cursor = 'crosshair';
            }
        }

        function resizeCanvas() {
            if (!canvas || !ctx) return;
            
            const container = canvas.parentElement;
            const dpr = window.devicePixelRatio || 1;
            const rect = container.getBoundingClientRect();
            
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            
            ctx.scale(dpr, dpr);
        }

        // ========================================
        // 数据处理
        // ========================================
        function startDataPolling() {
            const poll = async () => {
                try {
                    const data = await pywebview.api.get_new_data();
                    if (data && data.length > 0) {
                        processData(data);
                        updateConnectionStatus(true);
                    }
                } catch (e) {
                    updateConnectionStatus(false);
                }
                setTimeout(poll, 20);
            };
            poll();

            // 更新频率计算
            setInterval(() => {
                const rate = updateCount;
                updateCount = 0;
                if (updateRateEl) {
                    updateRateEl.textContent = rate + ' Hz';
                }
            }, 1000);

            // 连接状态超时检测
            setInterval(() => {
                if (Date.now() - lastUpdateTime > 2000) {
                    updateConnectionStatus(false);
                }
            }, 1000);
        }

        function processData(dataArray) {
            lastUpdateTime = Date.now();
            packetCount += dataArray.length;
            updateCount += dataArray.length;

            if (dataFlowIndicator) {
                dataFlowIndicator.classList.add('active');
                setTimeout(() => dataFlowIndicator.classList.remove('active'), 500);
            }

            dataArray.forEach(data => {
                // 存储图表数据
                CHANNEL_CONFIG.forEach(ch => {
                    const key = ch.key;
                    if (data[key] !== undefined) {
                        chartData[key].push({
                            time: packetCount,
                            value: data[key]
                        });
                        if (chartData[key].length > MAX_POINTS) {
                            chartData[key].shift();
                        }
                    }
                });

                // 更新统计显示
                updateStats(data);
            });

            // 更新计数显示
            if (packetCountEl) packetCountEl.textContent = packetCount.toLocaleString();
            if (dataPointCountEl) {
                const total = CHANNEL_CONFIG.reduce((sum, ch) => sum + chartData[ch.key].length, 0);
                dataPointCountEl.textContent = total.toLocaleString();
            }
        }

        function formatValue(value, decimals) {
            if (value === null || value === undefined) return '--';
            if (typeof value !== 'number') return String(value);
            return value.toFixed(decimals);
        }

        function updateStats(data) {
            // 顶部统计卡片 - 完整精度
            if (statNavX && data.nav_x !== undefined) statNavX.textContent = formatValue(data.nav_x, 6);
            if (statNavY && data.nav_y !== undefined) statNavY.textContent = formatValue(data.nav_y, 6);
            if (statSpeed && data.speed !== undefined) statSpeed.textContent = formatValue(data.speed, 6);
            if (statDir && data.direction !== undefined) statDir.textContent = formatValue(data.direction, 6);
            if (statHeight && data.height !== undefined) statHeight.textContent = formatValue(data.height, 6);
            if (statSat && data.sat_used !== undefined) statSat.textContent = data.sat_used;

            // 时间显示
            if (utcTimeEl && data.time_str) utcTimeEl.textContent = data.time_str;
            
            // 经纬度显示 - 最高精度（10位小数）
            if (latDisplayEl && data.latitude !== undefined) {
                const ns = data.ns > 0 ? 'N' : 'S';
                latDisplayEl.textContent = formatValue(Math.abs(data.latitude), 10) + '° ' + ns;
            }
            if (lonDisplayEl && data.longitude !== undefined) {
                const ew = data.ew > 0 ? 'E' : 'W';
                lonDisplayEl.textContent = formatValue(Math.abs(data.longitude), 10) + '° ' + ew;
            }

            // 状态显示
            if (stateDisplayEl && data.state !== undefined) {
                const states = ['无效', '单点定位', '差分定位', 'RTK浮点', 'RTK固定'];
                stateDisplayEl.textContent = states[data.state] || '未知(' + data.state + ')';
            }

            // 更新通道列表数值 - 各自精度
            CHANNEL_CONFIG.forEach(ch => {
                const el = document.getElementById(`ch-val-${ch.key}`);
                if (el && data[ch.key] !== undefined) {
                    el.textContent = formatValue(data[ch.key], ch.decimals);
                }
            });
        }

        function updateConnectionStatus(connected) {
            isConnected = connected;
            if (statusBadge) {
                statusBadge.className = `status-badge ${connected ? 'connected' : 'disconnected'}`;
            }
            if (statusText) {
                statusText.textContent = connected ? '已连接' : '未连接';
            }
        }

        function clearAllData() {
            CHANNEL_CONFIG.forEach(ch => {
                chartData[ch.key] = [];
            });
            packetCount = 0;
            if (packetCountEl) packetCountEl.textContent = '0';
            if (dataPointCountEl) dataPointCountEl.textContent = '0';
            
            // 清除显示值
            if (statNavX) statNavX.textContent = '--';
            if (statNavY) statNavY.textContent = '--';
            if (statSpeed) statSpeed.textContent = '--';
            if (statDir) statDir.textContent = '--';
            if (statHeight) statHeight.textContent = '--';
            if (statSat) statSat.textContent = '--';
            if (utcTimeEl) utcTimeEl.textContent = '--:--:--';
            if (latDisplayEl) latDisplayEl.textContent = '--';
            if (lonDisplayEl) lonDisplayEl.textContent = '--';
            if (stateDisplayEl) stateDisplayEl.textContent = '--';
            
            CHANNEL_CONFIG.forEach(ch => {
                const el = document.getElementById(`ch-val-${ch.key}`);
                if (el) el.textContent = '--';
            });
        }

        // ========================================
        // 波形绘制
        // ========================================
        function startAnimation() {
            const draw = () => {
                drawWaveform();
                animationId = requestAnimationFrame(draw);
            };
            draw();
        }

        function drawWaveform() {
            if (!canvas || !ctx) return;
            
            const width = canvas.width / (window.devicePixelRatio || 1);
            const height = canvas.height / (window.devicePixelRatio || 1);

            // 清除画布
            ctx.fillStyle = '#0a0f1a';
            ctx.fillRect(0, 0, width, height);

            // 绘制网格
            drawGrid(width, height);

            // 绘制每个选中的通道
            const selectedArray = Array.from(selectedChannels);
            
            selectedArray.forEach(key => {
                const data = chartData[key];
                const ch = CHANNEL_CONFIG.find(c => c.key === key);
                if (!ch || data.length < 2) return;

                // 计算该通道的数值范围
                const values = data.map(d => d.value);
                let minVal = Math.min(...values);
                let maxVal = Math.max(...values);
                
                // 防止范围过小
                if (maxVal - minVal < 0.0000001) {
                    minVal -= 1;
                    maxVal += 1;
                }
                const range = maxVal - minVal;

                // 绘制参数
                const padding = 50;
                const chartHeight = height - padding * 2;
                const chartWidth = width - padding * 2;

                // 绘制波形
                ctx.strokeStyle = ch.color;
                ctx.lineWidth = 1.5;
                ctx.lineJoin = 'round';
                ctx.lineCap = 'round';

                ctx.beginPath();
                data.forEach((point, i) => {
                    const x = padding + (i / (data.length - 1)) * chartWidth * zoomLevel + panOffset;
                    const y = padding + chartHeight - ((point.value - minVal) / range) * chartHeight;
                    
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                });
                ctx.stroke();

                // 绘制发光效果
                ctx.strokeStyle = ch.color;
                ctx.lineWidth = 3;
                ctx.globalAlpha = 0.2;
                ctx.stroke();
                ctx.globalAlpha = 1;

                // 绘制Y轴刻度标签
                ctx.fillStyle = ch.color;
                ctx.font = '10px JetBrains Mono';
                ctx.textAlign = 'right';
                ctx.globalAlpha = 0.7;
                
                const ySteps = 4;
                for (let i = 0; i <= ySteps; i++) {
                    const val = minVal + (range / ySteps) * i;
                    const y = padding + chartHeight - (i / ySteps) * chartHeight;
                    ctx.fillText(formatValue(val, ch.decimals > 4 ? 4 : ch.decimals), padding - 5, y + 3);
                }
                ctx.globalAlpha = 1;
            });

            // 绘制坐标轴
            drawAxisLabels(width, height);
        }

        function drawGrid(width, height) {
            const padding = 50;
            const chartWidth = width - padding * 2;
            const chartHeight = height - padding * 2;

            ctx.strokeStyle = '#1e2a3d';
            ctx.lineWidth = 1;

            // 垂直线
            const vLines = 10;
            for (let i = 0; i <= vLines; i++) {
                const x = padding + (chartWidth / vLines) * i;
                ctx.beginPath();
                ctx.moveTo(x, padding);
                ctx.lineTo(x, height - padding);
                ctx.stroke();
            }

            // 水平线
            const hLines = 6;
            for (let i = 0; i <= hLines; i++) {
                const y = padding + (chartHeight / hLines) * i;
                ctx.beginPath();
                ctx.moveTo(padding, y);
                ctx.lineTo(width - padding, y);
                ctx.stroke();
            }
        }

        function drawAxisLabels(width, height) {
            const padding = 50;
            ctx.fillStyle = '#4a5a75';
            ctx.font = '11px JetBrains Mono';
            ctx.textAlign = 'center';

            // X轴标签
            const selectedArray = Array.from(selectedChannels);
            if (selectedArray.length > 0) {
                const data = chartData[selectedArray[0]];
                if (data && data.length > 0) {
                    ctx.fillText('0', padding, height - 20);
                    ctx.fillText(data.length.toString(), width - padding, height - 20);
                    ctx.fillText('数据点', width / 2, height - 8);
                }
            }
        }

        function updateTooltip(e) {
            if (!canvas || !tooltip) return;
            
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const padding = 50;
            const chartWidth = rect.width - padding * 2;
            
            const selectedArray = Array.from(selectedChannels);
            if (selectedArray.length === 0) {
                tooltip.classList.remove('visible');
                return;
            }

            // 计算数据索引
            const dataLen = chartData[selectedArray[0]]?.length || 0;
            if (dataLen === 0) return;
            
            const ratio = (x - padding) / (chartWidth * zoomLevel) - panOffset / chartWidth;
            const index = Math.floor(ratio * dataLen);
            
            if (index < 0 || index >= dataLen) {
                tooltip.classList.remove('visible');
                return;
            }

            // 构建 tooltip 内容
            let html = `<div style="margin-bottom:4px;color:#7a8ba8">索引: ${index}</div>`;
            selectedArray.forEach(key => {
                const ch = CHANNEL_CONFIG.find(c => c.key === key);
                const point = chartData[key]?.[index];
                if (ch && point) {
                    html += `<div style="color:${ch.color}">${ch.name}: ${formatValue(point.value, ch.decimals)}</div>`;
                }
            });

            if (html) {
                tooltip.innerHTML = html;
                tooltip.style.left = Math.min(x + 15, rect.width - 200) + 'px';
                tooltip.style.top = (y - 10) + 'px';
                tooltip.classList.add('visible');
            }
        }

        // ========================================
        // 工具函数
        // ========================================
        function showToast(type, message) {
            if (!toastEl) return;
            
            toastEl.className = `toast ${type}`;
            toastEl.textContent = message;
            toastEl.classList.add('show');
            
            setTimeout(() => {
                toastEl.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
