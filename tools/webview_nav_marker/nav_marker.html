<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>惯导打点上位机</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--bd:#d9e0ea;--txt:#1f2a37;--muted:#5f6c7d;--ok:#0e9f6e;--pri:#2f6fed;--warn:#c43d3d}
*{box-sizing:border-box}body{margin:0;font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 10px;background:#fff;border-bottom:1px solid var(--bd)}
.left,.right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.title{font-weight:700;font-size:17px}
.tag{padding:4px 8px;border-radius:999px;border:1px solid var(--bd);font-size:12px;background:#eef3f9}.ok{color:#0a7a54;background:#eaf9f2;border-color:#95d8bf}.warn{color:#8c5f1f;background:#fff6e7;border-color:#efd8aa}.err{color:#972f2f;background:#fff1f1;border-color:#efc1c1}
button,select{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer}button.active{background:var(--pri);color:#fff;border-color:var(--pri)}button.primary{background:var(--ok);color:#fff;border-color:var(--ok)}button.danger{background:var(--warn);color:#fff;border-color:var(--warn)}
.main{flex:1;display:grid;grid-template-columns:minmax(520px,1fr) 350px;gap:10px;padding:10px;min-height:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;min-height:0}
.canvas-card{position:relative;display:flex;overflow:hidden}#cv{width:100%;height:100%;display:block;cursor:grab;background:#f9fbff}
.hint{position:absolute;left:10px;bottom:10px;background:#fff;border:1px solid var(--bd);border-radius:8px;padding:6px 8px;font-size:12px;color:var(--muted);line-height:1.4}
.side{display:flex;flex-direction:column;gap:10px;padding:10px}.box{border:1px solid var(--bd);border-radius:8px;padding:8px}.box h3{margin:0 0 8px;font-size:14px}
.kv{display:grid;grid-template-columns:85px 1fr;gap:5px;font-size:12px}.k{color:var(--muted)}.ops{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.table-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--bd);border-radius:8px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:5px;border-bottom:1px solid #edf1f6;text-align:center}th{position:sticky;top:0;background:#f5f8fd}
tr.sel{background:#eaf2ff}.toast{position:fixed;right:12px;bottom:12px;background:#fff;border:1px solid var(--bd);padding:8px 10px;border-radius:8px;opacity:0;transform:translateY(12px);transition:.2s;font-size:12px;max-width:420px}.toast.show{opacity:1;transform:none}
@media(max-width:1100px){.main{grid-template-columns:1fr}.side{max-height:45vh}}
</style>
</head>
<body>
<div class="top">
  <div class="left">
    <div class="title">惯导打点上位机</div>
    <div id="st" class="tag warn">等待数据</div>
    <div id="fps" class="tag">FPS:0</div>
    <div id="trajN" class="tag">轨迹:0</div>
    <div id="markN" class="tag">标记:0</div>
    <div id="payload" class="tag">Payload:--</div>
  </div>
  <div class="right">
    <button id="bFollow" class="active">跟踪视角</button>
    <button id="bAdaptive">自适应视角</button>
    <button id="bFit">适配全图</button>
    <button id="bReset">重置视图</button>
    <button id="bAdd">添加当前点</button>
    <button id="bExport" class="primary">导出CSV</button>
  </div>
</div>
<div class="main">
  <div class="card canvas-card">
    <canvas id="cv"></canvas>
    <div class="hint">拖拽平移 | 滚轮缩放 | 双击加点 | 拖动点可位移<br/>下位机 mark_trigger=1 自动打点</div>
  </div>
  <div class="card side">
    <div class="box">
      <h3>选中点编辑</h3>
      <div class="kv">
        <div class="k">序号</div><div id="si">-</div>
        <div class="k">X(mm)</div><div id="sx">-</div>
        <div class="k">Y(mm)</div><div id="sy">-</div>
        <div class="k">来源</div><div id="ss">-</div>
      </div>
      <div class="ops">
        <label>类型<select id="selType"></select></label>
        <button id="bDel" class="danger">删除选中</button>
        <button id="bClrM">清空标记</button>
        <button id="bClrT">清空轨迹</button>
      </div>
    </div>
    <div class="box" style="display:flex;flex-direction:column;min-height:0;flex:1">
      <h3>标记点列表</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>X</th><th>Y</th><th>Type</th><th>操作</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">导出列: total_count,index,x,y,point_type</div>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
const TYPES=[{value:0,label:'0 PATH'},{value:1,label:'1 CIRCLE'},{value:2,label:'2 SLOPE'},{value:3,label:'3 JUMP'},{value:4,label:'4 BRIDGE'},{value:5,label:'5 BUMP'}];
const COLORS={0:'#2f6fed',1:'#d97706',2:'#0e9f6e',3:'#d14343',4:'#7c3aed',5:'#059669'};
const S={api:false,traj:[],marks:[],nextId:1,sel:null,maxTraj:30000,maxMarks:1200,last:null,lastMarkLoop:null,lastTrigger:0,payload:'--',rx:0,fps:0,dragId:null,pan:false,mx:0,my:0,lastDataAt:0};
const V={scale:0.035,ox:0,oy:0,follow:true,adaptive:false};
const E={st:st,fps:fps,trajN:trajN,markN:markN,payload:payload,cv:cv,bFollow:bFollow,bAdaptive:bAdaptive,bFit:bFit,bReset:bReset,bAdd:bAdd,bExport:bExport,bDel:bDel,bClrM:bClrM,bClrT:bClrT,selType:selType,rows:rows,si:si,sx:sx,sy:sy,ss:ss,toast:toast};
const ctx=E.cv.getContext('2d');
function tip(t){E.toast.textContent=t;E.toast.classList.add('show');clearTimeout(tip.t);tip.t=setTimeout(()=>E.toast.classList.remove('show'),2200)}
function clampType(v){v=Number(v);if(Number.isNaN(v))return 0;return Math.max(0,Math.min(5,Math.round(v)))}
function fillType(sel,v){sel.innerHTML=TYPES.map(t=>`<option value="${t.value}">${t.label}</option>`).join('');sel.value=String(clampType(v))}
function size(){return{w:E.cv.clientWidth,h:E.cv.clientHeight}}
function resize(){const dpr=window.devicePixelRatio||1;const s=size();E.cv.width=Math.max(1,Math.floor(s.w*dpr));E.cv.height=Math.max(1,Math.floor(s.h*dpr));ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function center(){const s=size();return{x:s.w*0.5+V.ox,y:s.h*0.5+V.oy}}
function w2s(x,y){const c=center();return{x:c.x+x*V.scale,y:c.y-y*V.scale}}
function s2w(x,y){const c=center();return{x:(x-c.x)/V.scale,y:-(y-c.y)/V.scale}}
function getSel(){return S.marks.find(m=>m.id===S.sel)||null}
function addMark(x,y,t,src){const m={id:S.nextId++,x:Number(x),y:Number(y),type:clampType(t),src:src||'manual'};S.marks.push(m);if(S.marks.length>S.maxMarks)S.marks.splice(0,S.marks.length-S.maxMarks);S.sel=m.id;syncMarks();draw()}
function rmSel(){if(S.sel==null)return;const n=S.marks.length;S.marks=S.marks.filter(m=>m.id!==S.sel);if(S.marks.length!==n){S.sel=S.marks.length?S.marks[S.marks.length-1].id:null;syncMarks();draw()}}
function fitAll(){const pts=[];for(const p of S.traj)pts.push({x:p.x,y:p.y});for(const m of S.marks)pts.push({x:m.x,y:m.y});if(!pts.length)return;let minX=pts[0].x,maxX=pts[0].x,minY=pts[0].y,maxY=pts[0].y;for(let i=1;i<pts.length;i++){const p=pts[i];if(p.x<minX)minX=p.x;if(p.x>maxX)maxX=p.x;if(p.y<minY)minY=p.y;if(p.y>maxY)maxY=p.y}const s=size();const m=60;const w=Math.max(10,s.w-m*2),h=Math.max(10,s.h-m*2);const rx=Math.max(10,maxX-minX),ry=Math.max(10,maxY-minY);V.scale=Math.max(0.0015,Math.min(2.2,Math.min(w/rx,h/ry)));const cx=(minX+maxX)*0.5,cy=(minY+maxY)*0.5;V.ox=-cx*V.scale;V.oy=cy*V.scale}
function follow(){if(!S.last)return;V.ox=-S.last.x*V.scale;V.oy=S.last.y*V.scale}
function hit(px,py){let best=null,bd=9999;for(const m of S.marks){const p=w2s(m.x,m.y);const d=Math.hypot(px-p.x,py-p.y);if(d<11&&d<bd){best=m;bd=d}}return best}
function grid(w,h){let sp=1000*V.scale;while(sp<24)sp*=2;while(sp>120)sp*=0.5;const c=center();ctx.strokeStyle='#e5ebf2';ctx.lineWidth=1;let sx=((c.x%sp)+sp)%sp;for(let x=sx;x<w;x+=sp){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}let sy=((c.y%sp)+sp)%sp;for(let y=sy;y<h;y+=sp){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}}
function axis(w,h){const c=center();ctx.strokeStyle='#b7cadf';ctx.lineWidth=1.2;ctx.beginPath();ctx.moveTo(0,c.y);ctx.lineTo(w,c.y);ctx.stroke();ctx.beginPath();ctx.moveTo(c.x,0);ctx.lineTo(c.x,h);ctx.stroke();ctx.fillStyle='#6183a8';ctx.beginPath();ctx.arc(c.x,c.y,3.5,0,Math.PI*2);ctx.fill()}
function drawTraj(){if(S.traj.length<2)return;ctx.strokeStyle='#2f6fed';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<S.traj.length;i++){const p=w2s(S.traj[i].x,S.traj[i].y);if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke();const last=S.traj[S.traj.length-1];const p=w2s(last.x,last.y);ctx.fillStyle='#114da5';ctx.beginPath();ctx.arc(p.x,p.y,5.5,0,Math.PI*2);ctx.fill()}
function drawMarks(){for(let i=0;i<S.marks.length;i++){const m=S.marks[i],p=w2s(m.x,m.y),sel=(m.id===S.sel),col=COLORS[m.type]||'#374151';ctx.fillStyle=col;ctx.beginPath();ctx.arc(p.x,p.y,sel?8:6.5,0,Math.PI*2);ctx.fill();if(sel){ctx.strokeStyle='#111827';ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,11,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#111827';ctx.font='12px Microsoft YaHei';ctx.fillText('#'+i,p.x+9,p.y-9);ctx.fillText(String(m.type),p.x+9,p.y+7)}}
function draw(){const s=size();ctx.clearRect(0,0,s.w,s.h);grid(s.w,s.h);axis(s.w,s.h);drawTraj();drawMarks()}
function syncTop(){E.fps.textContent='FPS:'+S.fps;E.trajN.textContent='轨迹:'+S.traj.length;E.markN.textContent='标记:'+S.marks.length;E.payload.textContent='Payload:'+S.payload}
function syncSel(){const m=getSel();if(!m){E.si.textContent='-';E.sx.textContent='-';E.sy.textContent='-';E.ss.textContent='-';fillType(E.selType,0);return}const idx=S.marks.findIndex(v=>v.id===m.id);E.si.textContent=String(idx);E.sx.textContent=m.x.toFixed(1);E.sy.textContent=m.y.toFixed(1);E.ss.textContent=m.src;fillType(E.selType,m.type)}
function syncRows(){E.rows.innerHTML=S.marks.map((m,i)=>{const opts=TYPES.map(t=>`<option value="${t.value}" ${m.type===t.value?'selected':''}>${t.value}</option>`).join('');return `<tr class="${m.id===S.sel?'sel':''}"><td>${i}</td><td>${m.x.toFixed(0)}</td><td>${m.y.toFixed(0)}</td><td><select class="rt" data-id="${m.id}">${opts}</select></td><td><button class="rf" data-id="${m.id}">选中</button><button class="rd" data-id="${m.id}">删</button></td></tr>`}).join('');E.rows.querySelectorAll('.rf').forEach(b=>b.onclick=()=>{S.sel=Number(b.dataset.id);syncMarks();draw()});E.rows.querySelectorAll('.rd').forEach(b=>b.onclick=()=>{const id=Number(b.dataset.id);S.marks=S.marks.filter(v=>v.id!==id);if(S.sel===id)S.sel=S.marks.length?S.marks[S.marks.length-1].id:null;syncMarks();draw()});E.rows.querySelectorAll('.rt').forEach(s=>s.onchange=()=>{const id=Number(s.dataset.id);const m=S.marks.find(v=>v.id===id);if(!m)return;m.type=clampType(s.value);if(S.sel===id)syncSel();draw()})}
function syncMarks(){syncTop();syncSel();syncRows()}
function setConn(ok,text,cls){E.st.className='tag '+cls;E.st.textContent=text;if(ok)S.lastDataAt=performance.now()}
function exportPayload(){return S.marks.map((m,i)=>({index:i,x:m.x,y:m.y,point_type:m.type}))}
function feed(frames){if(!Array.isArray(frames)||!frames.length)return;for(const it of frames){const x=Number(it.nav_x),y=Number(it.nav_y);if(Number.isFinite(x)&&Number.isFinite(y)){S.last={x,y,loop:Number(it.loop)||0,pt:clampType(it.point_type||0)};S.traj.push({x,y})}const trig=Number(it.mark_trigger)||0;if(trig===1&&S.lastTrigger===0&&S.last){addMark(S.last.x,S.last.y,it.point_type||0,'device');S.lastMarkLoop=Number(it.loop)||0}S.lastTrigger=trig;S.payload=it.payload_size||'--'}if(S.traj.length>S.maxTraj)S.traj.splice(0,S.traj.length-S.maxTraj);S.rx+=frames.length;S.lastDataAt=performance.now();if(V.adaptive)fitAll();else if(V.follow)follow();syncTop();draw()}
async function pollData(){if(!S.api||!window.pywebview||!window.pywebview.api){setTimeout(pollData,120);return}try{const d=await window.pywebview.api.get_new_data();if(d&&d.length){setConn(true,'已连接','ok');feed(d)}}catch(_){setConn(false,'接口异常','err')}setTimeout(pollData,38)}
let stTick=0;async function pollStatus(){if(!S.api||!window.pywebview||!window.pywebview.api){setTimeout(pollStatus,500);return}try{const s=await window.pywebview.api.get_status();if(s&&s.server_error)setConn(false,s.server_error,'err');else if(s&&s.connected){const p=s.peer?`已连接 ${s.peer}`:'已连接';if(s.data_fresh||s.frame_fresh)setConn(true,p,'ok');else setConn(false,p+' (无有效数据)','warn')}else setConn(false,'等待连接','warn');stTick+=1;if(stTick%4===0&&s)E.payload.textContent='Payload:'+(s.last_payload_size||'--')}catch(_){ }setTimeout(pollStatus,320)}
function initCanvas(){const c=E.cv;c.onmousedown=(ev)=>{const r=c.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;const m=hit(x,y);S.mx=x;S.my=y;if(m){S.sel=m.id;S.dragId=m.id;c.style.cursor='move'}else{S.pan=true;c.style.cursor='grabbing'}syncMarks();draw()};c.onmousemove=(ev)=>{const r=c.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top;if(S.dragId!=null){const m=S.marks.find(v=>v.id===S.dragId);if(m){const p=s2w(x,y);m.x=p.x;m.y=p.y;syncSel();syncRows();draw()}return}if(S.pan){const dx=x-S.mx,dy=y-S.my;V.ox+=dx;V.oy+=dy;S.mx=x;S.my=y;V.follow=false;E.bFollow.classList.remove('active');draw()}};const stop=()=>{S.dragId=null;S.pan=false;c.style.cursor='grab'};c.onmouseup=stop;c.onmouseleave=stop;c.onwheel=(ev)=>{ev.preventDefault();const r=c.getBoundingClientRect(),sx=ev.clientX-r.left,sy=ev.clientY-r.top;const p=s2w(sx,sy);V.scale*=ev.deltaY>0?0.9:1.1;V.scale=Math.max(0.0015,Math.min(2.5,V.scale));const s=size();V.ox=sx-s.w*0.5-p.x*V.scale;V.oy=sy-s.h*0.5+p.y*V.scale;V.follow=false;E.bFollow.classList.remove('active');draw()};c.ondblclick=(ev)=>{const r=c.getBoundingClientRect(),x=ev.clientX-r.left,y=ev.clientY-r.top,p=s2w(x,y);addMark(p.x,p.y,Number(E.selType.value||0),'manual');tip('已新增标记点')}}
function initBtns(){fillType(E.selType,0);E.selType.onchange=()=>{const m=getSel();if(!m)return;m.type=clampType(E.selType.value);syncRows();draw()};E.bFollow.onclick=()=>{V.follow=!V.follow;E.bFollow.classList.toggle('active',V.follow);if(V.follow){follow();draw()}};E.bAdaptive.onclick=()=>{V.adaptive=!V.adaptive;E.bAdaptive.classList.toggle('active',V.adaptive);if(V.adaptive){fitAll();draw()}};E.bFit.onclick=()=>{fitAll();draw()};E.bReset.onclick=()=>{V.scale=0.035;V.ox=0;V.oy=0;draw()};E.bAdd.onclick=()=>{if(!S.last){tip('当前没有可用轨迹点');return}addMark(S.last.x,S.last.y,Number(E.selType.value||S.last.pt||0),'manual');tip('已添加当前点')};E.bDel.onclick=()=>{rmSel();tip('已删除选中点')};E.bClrM.onclick=()=>{S.marks=[];S.sel=null;syncMarks();draw();tip('已清空标记点')};E.bClrT.onclick=async()=>{S.traj=[];S.last=null;S.lastMarkLoop=null;S.lastTrigger=0;if(S.api&&window.pywebview&&window.pywebview.api){try{await window.pywebview.api.clear_history()}catch(_){ }}draw();syncTop();tip('已清空轨迹')};E.bExport.onclick=async()=>{const p=exportPayload();if(!p.length){tip('没有可导出的标记点');return}if(!S.api||!window.pywebview||!window.pywebview.api){tip('后端 API 未就绪');return}try{const r=await window.pywebview.api.export_mark_points_csv(p);tip(r&&r.msg?r.msg:'导出完成')}catch(e){tip('导出失败:'+ (e.message||e))}}
}
function initApi(){const ck=()=>{if(window.pywebview&&window.pywebview.api){S.api=true;return true}return false};window.addEventListener('pywebviewready',()=>{S.api=true});const t=setInterval(()=>{if(ck())clearInterval(t)},80)}
function initFps(){setInterval(()=>{S.fps=S.rx;S.rx=0;syncTop()},1000)}
function boot(){initBtns();initCanvas();initApi();initFps();resize();syncMarks();pollData();pollStatus();window.addEventListener('resize',resize)}
document.addEventListener('DOMContentLoaded',boot);
</script>
</body>
</html>
