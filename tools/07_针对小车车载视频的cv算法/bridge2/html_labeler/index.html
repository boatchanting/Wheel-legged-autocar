<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单边桥 PNG 打标器</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="panel">
        <h1>单边桥 PNG 打标器</h1>
        <p class="muted">以算法结果 PNG 为基础修改，只保存最终 PNG。</p>
      </div>

      <div class="panel">
        <div class="button-row">
          <button id="pick-draw-dir" type="button">选择结果目录</button>
          <button id="pick-original-dir" type="button">选择原图目录</button>
          <button id="pick-output-dir" type="button">选择输出目录</button>
        </div>
        <div class="button-row">
          <button id="fallback-draw-dir" type="button" class="secondary">文件夹导入结果</button>
          <button id="fallback-original-dir" type="button" class="secondary">文件夹导入原图</button>
        </div>
        <input id="draw-input" type="file" webkitdirectory directory multiple hidden>
        <input id="original-input" type="file" webkitdirectory directory multiple hidden>
        <div class="path-list">
          <div><span class="label">结果目录</span><span id="draw-dir-label" class="value">未选择</span></div>
          <div><span class="label">原图目录</span><span id="original-dir-label" class="value">未选择</span></div>
          <div><span class="label">输出目录</span><span id="output-dir-label" class="value">未选择</span></div>
        </div>
      </div>

      <div class="panel">
        <div class="toolbar-header">
          <h2>文件列表</h2>
          <span id="file-count" class="muted">0 张</span>
        </div>
        <div id="file-list" class="file-list"></div>
      </div>
    </aside>

    <main class="main-panel">
      <section class="panel top-controls">
        <div class="button-row">
          <button id="prev-frame" type="button">上一张 N</button>
          <button id="next-frame" type="button">下一张 M</button>
          <button id="save-frame" type="button" class="primary">保存当前</button>
          <button id="save-next-frame" type="button">保存并下一张</button>
          <button id="accept-original" type="button">采纳算法图</button>
          <button id="reset-frame" type="button">重置当前</button>
          <button id="undo-action" type="button">撤销</button>
          <button id="redo-action" type="button">重做</button>
        </div>

        <div class="button-row line-tools">
          <button id="tool-left" type="button" data-tool="left" class="tool-button">1 左线</button>
          <button id="tool-right" type="button" data-tool="right" class="tool-button">2 右线</button>
          <button id="tool-pink" type="button" data-tool="pink" class="tool-button">3 末尾线</button>
          <button id="tool-yellow" type="button" data-tool="yellow" class="tool-button">4 起始线</button>
        </div>

        <div class="button-row">
          <button id="clear-left" type="button">清左线</button>
          <button id="clear-right" type="button">清右线</button>
          <button id="clear-pink" type="button">清末尾线</button>
          <button id="clear-yellow" type="button">清起始线</button>
          <label class="checkbox">
            <input id="replace-on-draw" type="checkbox" checked>
            绘制前自动清同色
          </label>
        </div>

        <div class="status-grid">
          <div><span class="label">当前文件</span><span id="current-file" class="value">未加载</span></div>
          <div><span class="label">状态</span><span id="frame-status" class="value">等待目录</span></div>
          <div><span class="label">工具</span><span id="active-tool-label" class="value">左线</span></div>
          <div><span class="label">缩放</span><span id="zoom-label" class="value">6x</span></div>
          <div><span class="label">提示</span><span id="pointer-label" class="value">点击起点，再点击终点</span></div>
        </div>
      </section>

      <section class="panel canvas-panel">
        <div class="canvas-toolbar">
          <button id="zoom-out" type="button">缩小</button>
          <button id="zoom-in" type="button">放大</button>
          <button id="fit-zoom" type="button">适中</button>
        </div>
        <div id="canvas-scroll" class="canvas-scroll">
          <canvas id="annotator-canvas" width="96" height="60"></canvas>
        </div>
      </section>

      <section class="panel shortcuts-panel">
        <h2>快捷键</h2>
        <div class="shortcut-grid">
          <span>`1 2 3 4` 选择左/右/末尾/起始线</span>
          <span>`← → ↑ ↓` 清对应颜色并切到该线</span>
          <span>`Ctrl+S` 保存当前</span>
          <span>`Shift+S` 保存并下一张</span>
          <span>`A` 采纳算法图并保存</span>
          <span>`Ctrl+Z / Ctrl+Y` 撤销 / 重做</span>
          <span>`Backspace` 重置当前</span>
          <span>`[` `]` 缩放</span>
          <span>`N / M` 上一张 / 下一张</span>
          <span>`Esc` 取消当前起点</span>
        </div>
      </section>
    </main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
