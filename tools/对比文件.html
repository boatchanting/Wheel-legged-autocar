<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件夹对比工具 (Diff Tool)</title>
    
    <!-- 引入 Diff2Html 和相关依赖的样式与脚本 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/github.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/diff2html/bundles/css/diff2html.min.css" />
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部控制栏 */
        .header {
            padding: 10px 20px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }
        
        .input-group label {
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-bottom: 4px;
        }

        /* 主体布局 */
        .container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧文件列表 */
        .sidebar {
            width: 300px;
            background-color: #f0f0f0;
            border-right: 1px solid #ddd;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .file-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #e0e0e0;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .file-item:hover {
            background-color: #e8e8e8;
        }

        .file-item.active {
            background-color: #007bff;
            color: white;
        }

        /* 状态颜色 */
        .status-mod { border-left: 5px solid #ffc107; } /* 修改 */
        .status-add { border-left: 5px solid #28a745; } /* 新增 */
        .status-del { border-left: 5px solid #dc3545; } /* 删除 */
        .status-same { border-left: 5px solid #6c757d; color: #666; } /* 无变化 */

        /* 右侧对比区域 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background-color: white;
        }

        #diff-container {
            max-width: 100%;
        }

        /* 提示信息 */
        .empty-state {
            padding: 50px;
            text-align: center;
            color: #888;
        }
    </style>

    <!-- 依赖库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jschardet/3.0.0/jschardet.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/diff/dist/diff.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/diff2html/bundles/js/diff2html-ui.min.js"></script>
</head>
<body>

    <div class="header">
        <div class="input-group">
            <label>1. 基准文件夹 (Base):</label>
            <input type="file" id="baseInput" webkitdirectory directory multiple>
        </div>
        <div class="input-group">
            <label>2. 对比文件夹 (Compare):</label>
            <input type="file" id="compInput" webkitdirectory directory multiple>
        </div>
        <div style="margin-left: auto; font-size: 12px; color: #666;">
            提示: 仅展示根目录下一级文件的变化
        </div>
    </div>

    <div class="container">
        <div class="sidebar" id="fileList">
            <div style="padding: 10px; color: #666;">请选择上方两个文件夹...</div>
        </div>
        <div class="main-content">
            <div id="diff-container">
                <div class="empty-state">请在左侧选择文件查看对比</div>
            </div>
        </div>
    </div>

    <script>
        // 存储文件对象的 Map: filename -> File
        let baseFilesMap = new Map();
        let compFilesMap = new Map();

        const baseInput = document.getElementById('baseInput');
        const compInput = document.getElementById('compInput');
        const fileListEl = document.getElementById('fileList');
        const diffContainer = document.getElementById('diff-container');

        // 监听输入变化
        baseInput.addEventListener('change', handleFilesChange);
        compInput.addEventListener('change', handleFilesChange);

        function handleFilesChange() {
            // 清空旧数据
            if (this.id === 'baseInput') baseFilesMap.clear();
            if (this.id === 'compInput') compFilesMap.clear();

            // 处理文件
            const processInput = (input, map) => {
                if (!input.files) return;
                for (let file of input.files) {
                    // webkitRelativePath 格式通常为 "FolderName/FileName.txt"
                    const parts = file.webkitRelativePath.split('/');
                    
                    // 过滤：只保留深度为2的（FolderName + FileName），即不包含子文件夹
                    if (parts.length === 2) {
                        const fileName = parts[1];
                        // 过滤隐藏文件（可选）
                        if (!fileName.startsWith('.')) {
                            map.set(fileName, file);
                        }
                    }
                }
            };

            if (this.id === 'baseInput') processInput(baseInput, baseFilesMap);
            if (this.id === 'compInput') processInput(compInput, compFilesMap);

            // 只有当两个文件夹都有数据（或用户已操作过）时才渲染列表
            renderFileList();
        }

        function renderFileList() {
            fileListEl.innerHTML = '';
            
            // 获取所有唯一的文件名并集
            const allFileNames = new Set([...baseFilesMap.keys(), ...compFilesMap.keys()]);
            const sortedNames = Array.from(allFileNames).sort();

            if (sortedNames.length === 0) {
                fileListEl.innerHTML = '<div style="padding:10px;">未找到文件</div>';
                return;
            }

            sortedNames.forEach(name => {
                const inBase = baseFilesMap.has(name);
                const inComp = compFilesMap.has(name);
                
                const div = document.createElement('div');
                div.className = 'file-item';
                div.textContent = name;

                if (inBase && inComp) {
                    div.classList.add('status-mod'); // 潜在修改，具体要点进去看，暂标记为Modify颜色
                    // 实际上这里应该叫 "Exist in both"，点击后才会算 diff
                } else if (!inBase && inComp) {
                    div.classList.add('status-add'); // 新增
                    div.textContent += ' [新增]';
                } else if (inBase && !inComp) {
                    div.classList.add('status-del'); // 删除
                    div.textContent += ' [已删]';
                }

                div.onclick = () => loadAndDiff(name, div);
                fileListEl.appendChild(div);
            });
        }

        // 读取文件内容，自动识别编码
        function readFileAutoEncoding(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const buffer = e.target.result;
                        const uint8Array = new Uint8Array(buffer);
                        
                        // 使用 jschardet 检测编码
                        // 取前 4KB 检测即可，提高效率
                        const sampleSize = Math.min(uint8Array.length, 4096);
                        const sample = uint8Array.subarray(0, sampleSize);
                        const strSample = String.fromCharCode.apply(null, sample); 
                        // 注意: jschardet 需要二进制字符串，但较新版本可以直接传 Uint8Array 或者这里简单转换
                        
                        const detected = jschardet.detect(strSample); 
                        let encoding = detected.encoding || 'utf-8';

                        // 修正一些常见的识别偏差
                        if (encoding.toLowerCase() === 'ascii') encoding = 'utf-8';
                        
                        console.log(`File: ${file.name}, Detected Encoding: ${encoding}`);

                        const textDecoder = new TextDecoder(encoding);
                        const text = textDecoder.decode(uint8Array);
                        resolve(text);
                    } catch (err) {
                        console.error("Encoding detection failed, fallback to utf-8", err);
                        // 失败回退
                        const textDecoder = new TextDecoder('utf-8');
                        resolve(textDecoder.decode(e.target.result));
                    }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        async function loadAndDiff(fileName, domElement) {
            // UI 选中状态切换
            document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
            domElement.classList.add('active');
            
            diffContainer.innerHTML = '<div class="empty-state">正在读取并对比文件...</div>';

            const baseFile = baseFilesMap.get(fileName);
            const compFile = compFilesMap.get(fileName);

            let baseContent = '';
            let compContent = '';

            try {
                if (baseFile) baseContent = await readFileAutoEncoding(baseFile);
                if (compFile) compContent = await readFileAutoEncoding(compFile);
            } catch (e) {
                diffContainer.innerHTML = `<div class="empty-state" style="color:red">读取文件失败: ${e.message}</div>`;
                return;
            }

            // 如果内容完全一致，标记列表并提示
            if (baseContent === compContent) {
                domElement.className = 'file-item status-same active'; // 更新状态为无变化
                diffContainer.innerHTML = '<div class="empty-state">文件内容完全一致。</div>';
                return;
            } else {
                // 如果之前是 both exist，现在确认有差异
                if (baseFile && compFile) {
                    domElement.className = 'file-item status-mod active';
                }
            }

            // 生成 Diff
            // createTwoFilesPatch(fileName, fileName, originalStr, newStr, oldHeader, newHeader)
            const diffStr = Diff.createTwoFilesPatch(
                fileName, 
                fileName, 
                baseContent, 
                compContent, 
                '基准文件', 
                '对比文件'
            );

            // 渲染 Diff
            const targetElement = document.getElementById('diff-container');
            const configuration = {
                drawFileList: false,
                fileListToggle: false,
                fileListStartVisible: false,
                fileContentToggle: false,
                matching: 'lines',
                outputFormat: 'side-by-side', // 左右分栏
                synchronisedScroll: true,
                highlight: true,
                renderNothingWhenEmpty: false,
            };

            const diff2htmlUi = new Diff2HtmlUI(targetElement, diffStr, configuration);
            diff2htmlUi.draw();
            diff2htmlUi.highlightCode();
        }
    </script>
</body>
</html>
