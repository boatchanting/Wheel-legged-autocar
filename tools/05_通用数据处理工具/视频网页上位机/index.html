<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>视频网页上位机</title>
  <style>
    :root {
      --bg: #09111b;
      --bg-2: #122236;
      --panel: rgba(11, 20, 32, 0.82);
      --panel-2: rgba(17, 29, 46, 0.92);
      --line: rgba(137, 189, 255, 0.18);
      --line-strong: rgba(137, 189, 255, 0.38);
      --text: #f4f8fb;
      --muted: #9fb2c9;
      --accent: #54c2ff;
      --accent-2: #ffd166;
      --ok: #4dd4a2;
      --danger: #ff7a7a;
      --shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI Variable", "Microsoft YaHei UI", "PingFang SC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(84, 194, 255, 0.18), transparent 34%),
        radial-gradient(circle at right 15% top 10%, rgba(255, 209, 102, 0.12), transparent 28%),
        linear-gradient(145deg, #07111b 0%, #102035 55%, #07111b 100%);
    }

    .page {
      width: min(1400px, calc(100vw - 28px));
      margin: 18px auto 28px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 28px 30px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(11, 20, 32, 0.94), rgba(20, 36, 58, 0.9));
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: -30% auto auto 65%;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(84, 194, 255, 0.24), transparent 66%);
      pointer-events: none;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 999px;
      border: 1px solid rgba(84, 194, 255, 0.26);
      color: var(--accent);
      background: rgba(84, 194, 255, 0.08);
      font-size: 13px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(30px, 5vw, 48px);
      line-height: 1.02;
    }

    .hero p {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 18px;
      margin-top: 18px;
    }

    .card {
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow);
    }

    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px 0;
    }

    .card-head h2 {
      margin: 0;
      font-size: 20px;
    }

    .card-body {
      padding: 20px 22px 22px;
    }

    .upload-shell {
      border: 1px dashed var(--line-strong);
      border-radius: 20px;
      padding: 22px;
      background: linear-gradient(180deg, rgba(84, 194, 255, 0.06), rgba(255, 255, 255, 0.01));
    }

    .upload-actions,
    .sample-list,
    .history-list {
      display: grid;
      gap: 12px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    label {
      color: var(--muted);
      font-size: 13px;
    }

    input,
    select,
    button {
      font: inherit;
    }

    input[type="number"],
    select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(126, 154, 189, 0.22);
      background: rgba(10, 18, 29, 0.92);
      color: var(--text);
      outline: none;
    }

    input[type="file"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 14px;
      border: 1px solid rgba(126, 154, 189, 0.22);
      background: rgba(10, 18, 29, 0.92);
      color: var(--muted);
    }

    .btn {
      border: 0;
      border-radius: 14px;
      padding: 13px 18px;
      color: #06111c;
      background: linear-gradient(135deg, var(--accent), #88d9ff);
      cursor: pointer;
      transition: transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
      box-shadow: 0 12px 26px rgba(84, 194, 255, 0.28);
      font-weight: 700;
    }

    .btn:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    .btn.secondary {
      color: var(--text);
      background: linear-gradient(135deg, rgba(255,255,255,0.08), rgba(255,255,255,0.04));
      box-shadow: none;
      border: 1px solid var(--line);
    }

    .btn.warn {
      background: linear-gradient(135deg, var(--accent-2), #ffe7a0);
      box-shadow: 0 12px 26px rgba(255, 209, 102, 0.22);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .status {
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(126, 154, 189, 0.18);
      color: var(--muted);
      background: rgba(12, 20, 31, 0.92);
      min-height: 50px;
      line-height: 1.55;
    }

    .progress {
      width: 100%;
      height: 10px;
      margin-top: 12px;
      appearance: none;
      border: none;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress::-webkit-progress-bar {
      background: rgba(255,255,255,0.08);
    }

    .progress::-webkit-progress-value {
      background: linear-gradient(90deg, var(--accent), var(--ok));
    }

    .sample-item,
    .history-item {
      padding: 14px 16px;
      border-radius: 18px;
      border: 1px solid rgba(126, 154, 189, 0.14);
      background: rgba(14, 23, 36, 0.78);
    }

    .sample-top,
    .history-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .sample-name,
    .history-name {
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
    }

    .meta {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .sample-actions,
    .history-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .viewer {
      display: grid;
      gap: 16px;
    }

    .viewer-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .panel {
      padding: 14px;
      border-radius: 20px;
      border: 1px solid rgba(126, 154, 189, 0.16);
      background: var(--panel-2);
    }

    .panel h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .panel img,
    .panel video {
      width: 100%;
      border-radius: 14px;
      border: 1px solid rgba(126, 154, 189, 0.14);
      background: #04080f;
    }

    .facts {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .fact {
      padding: 12px 14px;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(126, 154, 189, 0.12);
    }

    .fact .k {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .fact .v {
      font-size: 16px;
      font-weight: 700;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .link-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 999px;
      text-decoration: none;
      color: var(--text);
      border: 1px solid rgba(126, 154, 189, 0.14);
      background: rgba(255,255,255,0.04);
    }

    .empty {
      padding: 22px;
      border-radius: 18px;
      color: var(--muted);
      border: 1px dashed rgba(126, 154, 189, 0.24);
      text-align: center;
    }

    @media (max-width: 1080px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .row,
      .viewer-grid,
      .facts {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 720px) {
      .page {
        width: calc(100vw - 18px);
      }

      .hero,
      .card {
        border-radius: 20px;
      }

      .row,
      .viewer-grid,
      .facts {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <section class="hero">
      <div class="eyebrow">Browser Host</div>
      <h1>低带宽视频网页上位机</h1>
      <p>像正常网页一样上传视频、直接处理样例、自动生成压缩码流、解码视频和最终展示版 MP4。整个过程都在本机完成，不需要额外框架。</p>
    </section>

    <section class="grid">
      <div class="card">
        <div class="card-head">
          <h2>上传与处理</h2>
          <button class="btn secondary" id="refreshBtn">刷新样例</button>
        </div>
        <div class="card-body">
          <div class="upload-shell">
            <div class="upload-actions">
              <div class="field">
                <label for="fileInput">选择本地视频或 `.lbvc` 文件</label>
                <input id="fileInput" type="file" accept=".avi,.mp4,.mov,.mkv,.lbvc" />
              </div>

              <div class="row">
                <div class="field">
                  <label for="scaleInput">缩放比例</label>
                  <input id="scaleInput" type="number" min="0.1" max="1" step="0.05" value="1.0" />
                </div>
                <div class="field">
                  <label for="bitrateInput">目标带宽 kbps</label>
                  <input id="bitrateInput" type="number" min="50" max="2000" step="10" value="200" />
                </div>
                <div class="field">
                  <label for="qualityInput">JPEG 质量</label>
                  <input id="qualityInput" type="number" min="10" max="95" step="1" value="95" />
                </div>
                <div class="field">
                  <label for="colorMode">颜色模式</label>
                  <select id="colorMode">
                    <option value="gray">gray</option>
                    <option value="color" selected>color</option>
                  </select>
                </div>
                <div class="field">
                  <label for="skipThresholdInput">跳帧阈值</label>
                  <input id="skipThresholdInput" type="number" min="0" max="20" step="0.1" value="0.0" />
                </div>
              </div>

              <div class="sample-actions">
                <button class="btn" id="uploadBtn">上传并处理</button>
              </div>

              <progress class="progress" id="uploadProgress" max="100" value="0"></progress>
              <div class="status" id="statusBox">等待操作。</div>
            </div>
          </div>

          <div class="card-head" style="padding-left:0; padding-right:0; margin-top:18px;">
            <h2>data 样例视频</h2>
          </div>
          <div class="sample-list" id="sampleList">
            <div class="empty">正在加载样例视频…</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>处理结果</h2>
        </div>
        <div class="card-body">
          <div class="viewer" id="viewer">
            <div class="empty">还没有结果。上传一个视频，或者点击右侧样例开始。</div>
          </div>
        </div>
      </div>
    </section>

    <section class="card" style="margin-top:18px;">
      <div class="card-head">
        <h2>最近结果</h2>
      </div>
      <div class="card-body">
        <div class="history-list" id="historyList">
          <div class="empty">暂无历史结果。</div>
        </div>
      </div>
    </section>
  </div>

  <script>
    const statusBox = document.getElementById("statusBox");
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const uploadProgress = document.getElementById("uploadProgress");
    const viewer = document.getElementById("viewer");
    const sampleList = document.getElementById("sampleList");
    const historyList = document.getElementById("historyList");
    const refreshBtn = document.getElementById("refreshBtn");

    function getParams() {
      return {
        scale: Number(document.getElementById("scaleInput").value || 1.0),
        target_bitrate_kbps: Number(document.getElementById("bitrateInput").value || 200),
        jpeg_quality: Number(document.getElementById("qualityInput").value || 95),
        color_mode: document.getElementById("colorMode").value || "color",
        skip_threshold: Number(document.getElementById("skipThresholdInput").value || 0.0),
      };
    }

    function setStatus(text, tone = "normal") {
      statusBox.textContent = text;
      statusBox.style.borderColor = tone === "error" ? "rgba(255,122,122,0.35)" : "rgba(126,154,189,0.18)";
      statusBox.style.color = tone === "error" ? "#ffd3d3" : "var(--muted)";
    }

    function setBusy(busy) {
      uploadBtn.disabled = busy;
      refreshBtn.disabled = busy;
      document.querySelectorAll(".sample-run").forEach((btn) => btn.disabled = busy);
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function renderResult(result) {
      const summary = result.summary_data || {};
      const browserPlayable = result.web_video
        ? `<video controls preload="metadata" src="${result.web_video.url}?t=${Date.now()}"></video>`
        : `<img src="${result.web_preview.url}?t=${Date.now()}" alt="animated showcase preview">`;
      const sourcePreview = result.source_preview
        ? `<div class="panel"><h3>输入预览</h3><img src="${result.source_preview.url}?t=${Date.now()}" alt="source preview"></div>`
        : `<div class="panel"><h3>输入预览</h3><div class="empty">LBVC 文件没有原始输入预览。</div></div>`;

      viewer.innerHTML = `
        <div class="viewer-grid">
          ${sourcePreview}
          <div class="panel">
            <h3>网页可播放预览</h3>
            ${browserPlayable}
          </div>
        </div>

        <div class="panel">
          <h3>浏览器播放说明</h3>
          <div class="empty" style="text-align:left;">
            页面优先使用浏览器兼容的 <code>WebM</code> 预览视频；如果当前环境无法生成 WebM，会自动回退到动图预览。
            最终展示版 MP4 和解码 MP4 仍会继续生成，方便你下载或本地播放器查看。
          </div>
        </div>

        <div class="facts">
          <div class="fact"><span class="k">输入规格</span><span class="v">${escapeHtml(summary.source_spec || "-")}</span></div>
          <div class="fact"><span class="k">码流规格</span><span class="v">${escapeHtml(summary.stream_spec || "-")}</span></div>
          <div class="fact"><span class="k">平均每帧字节</span><span class="v">${escapeHtml(summary.avg_frame_bytes || "-")}</span></div>
          <div class="fact"><span class="k">估算带宽</span><span class="v">${escapeHtml(summary.bandwidth_kbps || "-")} kbps</span></div>
          <div class="fact"><span class="k">目标带宽下帧率</span><span class="v">${escapeHtml(summary.target_fps || "-")}</span></div>
          <div class="fact"><span class="k">解码帧数</span><span class="v">${escapeHtml(summary.frames_decoded || "-")}</span></div>
          <div class="fact"><span class="k">差分帧数</span><span class="v">${escapeHtml(summary.delta_frames || "-")}</span></div>
          <div class="fact"><span class="k">跳帧数</span><span class="v">${escapeHtml(summary.skip_frames || "-")}</span></div>
          <div class="fact"><span class="k">传输模式</span><span class="v">${escapeHtml(summary.transport_mode || "-")}</span></div>
          <div class="fact"><span class="k">颜色模式</span><span class="v">${escapeHtml(summary.color_mode || "-")}</span></div>
        </div>

        <div class="panel">
          <h3>输出文件</h3>
          <div class="links">
            ${result.web_video ? `<a class="link-chip" href="${result.web_video.url}" target="_blank" rel="noreferrer">网页可播 WebM</a>` : ""}
            <a class="link-chip" href="${result.web_preview.url}" target="_blank" rel="noreferrer">网页动图 WebP</a>
            <a class="link-chip" href="${result.showcase.url}" target="_blank" rel="noreferrer">最终展示 MP4</a>
            <a class="link-chip" href="${result.decoded.url}" target="_blank" rel="noreferrer">解码视频 MP4</a>
            <a class="link-chip" href="${result.stream.url}" target="_blank" rel="noreferrer">压缩码流 LBVC</a>
            <a class="link-chip" href="${result.summary.url}" target="_blank" rel="noreferrer">处理摘要 JSON</a>
          </div>
        </div>
      `;
    }

    function renderSamples(samples) {
      if (!samples.length) {
        sampleList.innerHTML = `<div class="empty">没有找到样例视频。</div>`;
        return;
      }

      sampleList.innerHTML = samples.map((sample) => `
        <div class="sample-item">
          <div class="sample-top">
            <div>
              <div class="sample-name">${escapeHtml(sample.name)}</div>
              <div class="meta">${escapeHtml(sample.path)} · ${escapeHtml(sample.size_mb)} MB</div>
            </div>
            <button class="btn warn sample-run" data-path="${escapeHtml(sample.path)}">直接处理</button>
          </div>
        </div>
      `).join("");

      document.querySelectorAll(".sample-run").forEach((button) => {
        button.addEventListener("click", () => processSample(button.dataset.path));
      });
    }

    function renderHistory(history) {
      if (!history.length) {
        historyList.innerHTML = `<div class="empty">暂无历史结果。</div>`;
        return;
      }

      historyList.innerHTML = history.map((item) => `
        <div class="history-item">
          <div class="history-top">
            <div>
              <div class="history-name">${escapeHtml(item.summary_data?.source_name || "未命名结果")}</div>
              <div class="meta">${escapeHtml(item.created_at || "")}</div>
            </div>
          </div>
          <div class="meta" style="margin-top:8px;">
            ${escapeHtml(item.summary_data?.source_spec || "-")} → ${escapeHtml(item.summary_data?.stream_spec || "-")}
          </div>
          <div class="history-actions">
            ${item.web_video ? `<a class="link-chip" href="${item.web_video.url}" target="_blank" rel="noreferrer">网页视频</a>` : ""}
            ${item.web_preview ? `<a class="link-chip" href="${item.web_preview.url}" target="_blank" rel="noreferrer">网页动图</a>` : ""}
            ${item.preview ? `<a class="link-chip" href="${item.preview.url}" target="_blank" rel="noreferrer">预览图</a>` : ""}
            ${item.showcase ? `<a class="link-chip" href="${item.showcase.url}" target="_blank" rel="noreferrer">展示视频</a>` : ""}
            ${item.summary ? `<a class="link-chip" href="${item.summary.url}" target="_blank" rel="noreferrer">摘要</a>` : ""}
          </div>
        </div>
      `).join("");
    }

    async function loadSamplesAndHistory() {
      setStatus("正在刷新样例和历史结果…");
      try {
        const response = await fetch("/api/samples");
        const payload = await response.json();
        if (!payload.ok) {
          throw new Error(payload.error || "加载失败");
        }
        renderSamples(payload.samples || []);
        renderHistory(payload.history || []);
        setStatus("样例和历史结果已刷新。");
      } catch (error) {
        setStatus(`加载失败：${error.message}`, "error");
      }
    }

    async function loadHistory() {
      try {
        const response = await fetch("/api/history");
        const payload = await response.json();
        if (!payload.ok) {
          throw new Error(payload.error || "加载历史失败");
        }
        renderHistory(payload.history || []);
      } catch (error) {
        setStatus(`历史结果刷新失败：${error.message}`, "error");
      }
    }

    function uploadFile() {
      const file = fileInput.files?.[0];
      if (!file) {
        setStatus("请先选择一个视频或 .lbvc 文件。", "error");
        return;
      }

      const params = new URLSearchParams({
        filename: file.name,
        ...Object.fromEntries(Object.entries(getParams()).map(([key, value]) => [key, String(value)])),
      });

      const xhr = new XMLHttpRequest();
      xhr.open("POST", `/api/process-upload?${params.toString()}`);
      xhr.responseType = "json";
      xhr.upload.onprogress = (event) => {
        if (!event.lengthComputable) {
          return;
        }
        const percent = Math.round(event.loaded * 100 / event.total);
        uploadProgress.value = percent;
        setStatus(`正在上传 ${file.name}：${percent}%`);
      };

      xhr.onloadstart = () => {
        setBusy(true);
        uploadProgress.value = 0;
        setStatus(`开始上传 ${file.name}…`);
      };

      xhr.onload = async () => {
        setBusy(false);
        uploadProgress.value = 100;
        const payload = xhr.response;
        if (xhr.status >= 200 && xhr.status < 300 && payload?.ok) {
          renderResult(payload.result);
          setStatus(`处理完成：${file.name}`);
          await loadHistory();
        } else {
          setStatus(`处理失败：${payload?.error || "未知错误"}`, "error");
        }
      };

      xhr.onerror = () => {
        setBusy(false);
        setStatus("上传失败，请检查本地服务是否仍在运行。", "error");
      };

      xhr.onloadend = () => {
        if (uploadProgress.value < 100) {
          uploadProgress.value = 0;
        }
      };

      xhr.send(file);
    }

    async function processSample(samplePath) {
      setBusy(true);
      uploadProgress.value = 0;
      setStatus(`正在处理样例：${samplePath}`);
      try {
        const response = await fetch("/api/process-sample", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            sample_path: samplePath,
            params: getParams(),
          }),
        });
        const payload = await response.json();
        if (!payload.ok) {
          throw new Error(payload.error || "处理失败");
        }
        renderResult(payload.result);
        setStatus(`处理完成：${samplePath}`);
        await loadHistory();
      } catch (error) {
        setStatus(`处理失败：${error.message}`, "error");
      } finally {
        setBusy(false);
      }
    }

    uploadBtn.addEventListener("click", uploadFile);
    refreshBtn.addEventListener("click", loadSamplesAndHistory);
    loadSamplesAndHistory();
  </script>
</body>
</html>
